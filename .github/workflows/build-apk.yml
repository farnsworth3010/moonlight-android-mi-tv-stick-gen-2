name: Build patched Moonlight release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootRelease -x lintVitalAnalyzeNonRootRelease --no-daemon

      - name: Sign release APK (debug key)
        run: |
          UNSIGNED_APK="app/build/outputs/apk/nonRoot/release/app-nonRoot-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/nonRoot/release/app-nonRoot-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/nonRoot/release/app-nonRoot-release-signed-debugkey.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS_DIR="$(find "${SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$APKSIGNER" verify --verbose "$SIGNED_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-nonroot-release
          path: app/build/outputs/apk/nonRoot/release/app-nonRoot-release-signed-debugkey.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/nonRoot/release/app-nonRoot-release-signed-debugkey.apk

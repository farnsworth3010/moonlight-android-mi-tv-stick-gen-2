name: Build patched Moonlight release APK

on:
  workflow_dispatch:
    inputs:
      beta:
        description: "Publish this build as a beta (pre-release)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Determine beta status
        id: beta
        run: |
          # A build is considered "beta" if it was manually dispatched with the beta
          # input checked, or if the pushed tag contains a pre-release identifier
          # such as "-beta", "-alpha", or "-rc" (e.g. v12.2-beta.1).
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.beta }}" == "true" ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" =~ -(beta|alpha|rc)([.].*)?$ ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootRelease -x lintVitalAnalyzeNonRootRelease --no-daemon

      - name: Sign release APK (debug key)
        run: |
          UNSIGNED_APK="app/build/outputs/apk/nonRoot/release/app-nonRoot-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/nonRoot/release/app-nonRoot-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/nonRoot/release/app-nonRoot-release-signed-debugkey.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS_DIR="$(find "${SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$APKSIGNER" verify --verbose "$SIGNED_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-nonroot-${{ steps.beta.outputs.is_beta == 'true' && 'beta' || 'release' }}
          path: app/build/outputs/apk/nonRoot/release/app-nonRoot-release-signed-debugkey.apk

      - name: Set beta release tag
        if: github.event_name == 'workflow_dispatch' && steps.beta.outputs.is_beta == 'true'
        id: beta_tag
        run: echo "tag_name=beta-$(date +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || steps.beta_tag.outputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.beta_tag.outputs.tag_name || github.ref_name }}
          prerelease: ${{ steps.beta.outputs.is_beta == 'true' }}
          files: app/build/outputs/apk/nonRoot/release/app-nonRoot-release-signed-debugkey.apk
